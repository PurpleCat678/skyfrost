<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skyfrost</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b1020; overflow: hidden; font-family: ui-monospace, monospace; color: #cfe0ff; }
      #join { position: fixed; inset: 0; display: grid; place-content: center; gap: 16px; text-align: center; }
      #join h1 { margin: 0; font-size: 48px; letter-spacing: 0.2em; color: #e6f0ff; }
      #join input { font: inherit; font-size: 18px; padding: 10px 14px; width: 260px; background: #141c33; color: #e6f0ff; border: 1px solid #3a5a9a; border-radius: 6px; outline: none; text-align: center; }
      #join input:focus { border-color: #7fa8ff; }
      #join p { margin: 0; color: #7f93bf; }
    </style>
  </head>
  <body>
    <div id="join">
      <h1>SKYFROST</h1>
      <input id="name" maxlength="16" placeholder="Callsign" autocomplete="off" />
      <p>Press Enter to fly</p>
    </div>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
